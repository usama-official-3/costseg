<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Architecture placeholder</title>
  <desc id="desc">Original geometric commercial facade placeholder for CostSeg SI hero. Replace with licensed photography.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1f22"/>
      <stop offset="100%" stop-color="#0f1012"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e32" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#17191b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Far towers -->
  <g fill="#22262a">
    <rect x="80" y="220" width="140" height="580"/>
    <rect x="260" y="160" width="180" height="640"/>
    <rect x="900" y="200" width="160" height="600"/>
    <rect x="1080" y="280" width="100" height="520"/>
  </g>
  <!-- Main tower -->
  <rect x="480" y="80" width="320" height="720" fill="#1a1d20"/>
  <rect x="500" y="100" width="280" height="680" fill="url(#glass)"/>
  <!-- Window grid -->
  <g stroke="#2e3338" stroke-width="2" fill="none" opacity="0.85">
    <path d="M520 140h240M520 200h240M520 260h240M520 320h240M520 380h240M520 440h240M520 500h240M520 560h240M520 620h240M520 680h240"/>
    <path d="M580 100v680M640 100v680M700 100v680"/>
  </g>
  <!-- Lime accent seam -->
  <rect x="478" y="80" width="4" height="720" fill="#D6FF43" opacity="0.85"/>
  <!-- Ground plane -->
  <rect x="0" y="720" width="1200" height="80" fill="#121416"/>
  <rect x="0" y="720" width="1200" height="2" fill="#D6FF43" opacity="0.35"/>
</svg>
